version: '3.7'

services:
  yolov8:
    image: ultralytics/ultralytics:latest
    container_name: yolov11_container
    ipc: host
    volumes:
      - ../shared:/shared
      - ../pitching:/workspace/pitching
      - ../input:/workspace/input
      - ../output:/workspace/output
    working_dir: /workspace
    ports:
      - "6006:6006"
    environment:
      - DISPLAY=:1
      - PYTHONPATH=/workspace
    networks:
      - cap_backend
    tty: true
    # GPU を使う環境では docker-compose.gpu.yml を併用する:
    # docker compose -f docker-compose.yml -f docker-compose.gpu.yml up

networks:
  cap_backend:
    external: true
