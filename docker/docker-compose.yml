version: '3.7'

services:
  yolov8:
    image: ultralytics/ultralytics:latest
    container_name: yolov11_container
    ipc: host
    volumes:
      - ../shared:/shared
      # 投球フォーム解析。読み取り専用。
      # 抽出だけなら台本1つで動く:
      #   python /pitching/tools/extract-pose.py /shared/x.mov -o /shared/x_pose.json
      # ビューアまでコンテナで作るなら pydantic が要る（無ければ pip install pydantic）
      - ../pitching:/pitching:ro
    ports:
      - "6006:6006"
    environment:
      - DISPLAY=:1
      # /pitching を import できるようにする（tools/*.py が参照する）
      - PITCHING_ROOT=/
    networks:
      - cap_backend
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              count: all
networks: 
  cap_backend:
    external: true