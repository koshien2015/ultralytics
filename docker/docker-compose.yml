version: '3.7'

services:
  yolov8:
    image: ultralytics/ultralytics:latest
    container_name: yolov11_container
    ipc: host
    volumes:
      - ../shared:/shared
      # 投球フォーム解析の抽出台本。読み取り専用で1フォルダだけ入れる。
      # 使い方: python /pitching-tools/extract-pose.py /shared/... -o /shared/out/x.pose.json
      - ../pitching/tools:/pitching-tools:ro
    ports:
      - "6006:6006"
    environment:
      - DISPLAY=:1
    networks:
      - cap_backend
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              count: all
networks: 
  cap_backend:
    external: true